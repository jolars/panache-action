name: "panache-action"
description: "Install Panache and run format/lint checks"
author: "jolars"
inputs:
  path:
    description: "File or directory to check"
    required: false
    default: "."
  version:
    description: "Panache version to install (latest or vX.Y.Z)"
    required: false
    default: "latest"
  format:
    description: "Run panache format --check"
    required: false
    default: "true"
  lint:
    description: "Run panache lint"
    required: false
    default: "true"
  config:
    description: "Optional path to panache config file"
    required: false
    default: ""
  verify-checksum:
    description: "Verify the downloaded asset against the release's SHA256SUMS manifest (skips with a warning if the release has no manifest)"
    required: false
    default: "true"
outputs:
  version:
    description: "The installed panache version"
    value: ${{ steps.version-unix.outputs.version || steps.version-windows.outputs.version }}
runs:
  using: "composite"
  steps:
    - name: Resolve panache version
      id: resolve
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -eu
        REQUESTED="${{ inputs.version }}"
        if [ "$REQUESTED" = "latest" ]; then
          # Resolve to the newest non-draft release that contains this
          # platform's asset, not simply the newest release, whose binaries
          # may still be uploading (or have failed to build).
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64) ASSET="panache-x86_64-unknown-linux-gnu.tar.gz" ;;
          Linux-ARM64) ASSET="panache-aarch64-unknown-linux-gnu.tar.gz" ;;
          macOS-X64) ASSET="panache-x86_64-apple-darwin.tar.gz" ;;
          macOS-ARM64) ASSET="panache-aarch64-apple-darwin.tar.gz" ;;
          Windows-X64) ASSET="panache-x86_64-pc-windows-msvc.zip" ;;
          Windows-ARM64) ASSET="panache-aarch64-pc-windows-msvc.zip" ;;
          *)
            echo "Unsupported platform: ${RUNNER_OS}-${RUNNER_ARCH}" >&2
            exit 1
            ;;
          esac
          export ASSET
          RESOLVED="$(gh api "repos/jolars/panache/releases?per_page=100" \
            --jq '[.[] | select((.draft or .prerelease) | not) | select(any(.assets[]; .name == env.ASSET))][0].tag_name')"
          if [ -z "$RESOLVED" ] || [ "$RESOLVED" = "null" ]; then
            echo "Could not find a non-draft release containing ${ASSET}" >&2
            exit 1
          fi
          echo "Resolved latest to ${RESOLVED}"
        else
          case "$REQUESTED" in
          v*) RESOLVED="$REQUESTED" ;;
          *) RESOLVED="v${REQUESTED}" ;;
          esac
        fi
        echo "resolved-version=${RESOLVED}" >> "$GITHUB_OUTPUT"

    - name: Cache panache binary
      id: cache
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/panache-bin
        key: panache-${{ steps.resolve.outputs.resolved-version }}-${{ runner.os }}-${{ runner.arch }}

    - name: Install panache (Unix)
      if: runner.os != 'Windows' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: bash "${{ github.action_path }}/scripts/install-panache.sh"
      env:
        PANACHE_REPO: jolars/panache
        PANACHE_VERSION: ${{ steps.resolve.outputs.resolved-version }}
        PANACHE_INSTALL_DIR: ${{ runner.temp }}/panache-bin
        PANACHE_VERIFY_CHECKSUM: ${{ inputs.verify-checksum }}
        # Lets the install script run `gh attestation verify`.
        GH_TOKEN: ${{ github.token }}

    - name: Install panache (Windows)
      if: runner.os == 'Windows' && steps.cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: . "${{ github.action_path }}/scripts/install-panache.ps1"
      env:
        PANACHE_REPO: jolars/panache
        PANACHE_VERSION: ${{ steps.resolve.outputs.resolved-version }}
        PANACHE_INSTALL_DIR: ${{ runner.temp }}\panache-bin
        PANACHE_VERIFY_CHECKSUM: ${{ inputs.verify-checksum }}
        # Lets the install script run `gh attestation verify`.
        GH_TOKEN: ${{ github.token }}

    - name: Add panache to PATH (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: echo "${{ runner.temp }}/panache-bin" >> "$GITHUB_PATH"

    - name: Add panache to PATH (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: Add-Content -Path $env:GITHUB_PATH -Value "${{ runner.temp }}\panache-bin"

    - name: Capture panache version (Unix)
      if: runner.os != 'Windows'
      id: version-unix
      shell: bash
      run: |
        VERSION="$(panache --version | awk '{print $2}')"
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

    - name: Capture panache version (Windows)
      if: runner.os == 'Windows'
      id: version-windows
      shell: pwsh
      run: |
        $versionLine = panache --version
        $version = ($versionLine -split ' ')[1]
        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Run format check (Unix)
      if: runner.os != 'Windows' && inputs.format == 'true'
      shell: bash
      run: |
        CONFIG_ARGS=()
        if [ -n "${{ inputs.config }}" ]; then
          CONFIG_ARGS=(--config "${{ inputs.config }}")
        fi
        panache format --check "${{ inputs.path }}" "${CONFIG_ARGS[@]}"

    - name: Run format check (Windows)
      if: runner.os == 'Windows' && inputs.format == 'true'
      shell: pwsh
      run: |
        $args = @("format", "--check", "${{ inputs.path }}")
        if ("${{ inputs.config }}" -ne "") {
          $args += @("--config", "${{ inputs.config }}")
        }
        & panache @args

    - name: Run lint check (Unix)
      if: runner.os != 'Windows' && inputs.lint == 'true'
      shell: bash
      run: |
        CONFIG_ARGS=()
        if [ -n "${{ inputs.config }}" ]; then
          CONFIG_ARGS=(--config "${{ inputs.config }}")
        fi
        panache lint "${{ inputs.path }}" "${CONFIG_ARGS[@]}"

    - name: Run lint check (Windows)
      if: runner.os == 'Windows' && inputs.lint == 'true'
      shell: pwsh
      run: |
        $args = @("lint", "${{ inputs.path }}")
        if ("${{ inputs.config }}" -ne "") {
          $args += @("--config", "${{ inputs.config }}")
        }
        & panache @args
branding:
  icon: code
  color: gray-dark
